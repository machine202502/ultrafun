[workspace]
members = ["game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
game = { path = "game" }
glam = { version = "0.33.12", features = ["bytemuck", "serde"] }
parry3d = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "ultrafun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
game.workspace = true
glam.workspace = true
serde.workspace = true
winit = { version = "0.30.13", features = ["serde"] }
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
kira = "0.12.6"
gltf = { version = "1.4.1", features = ["KHR_lights_punctual"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ron = "0.12.2"
notify = "8.2.1"
directories = "6.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
log = "0.4.34"
env_logger = "0.11.11"
anyhow = "1.0.104"
tracy-client = { version = "0.19.0", optional = true }

[features]
profile = ["dep:tracy-client"]

[lints]
workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[[example]]
name = "placeholder_sounds"
test = true

[[example]]
name = "generate_atlases"
test = true

[[example]]
name = "generate_characters"
test = true

[[example]]
name = "placeholder_music"
test = true
